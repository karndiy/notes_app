<!DOCTYPE html>
<html lang="en" data-theme="{{ current_theme() }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
{% set t = current_theme() %}
{% if t == 'auto' %}<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)">
{% else %}<meta name="theme-color" content="{{ {'light': '#f5f5f7', 'warm': '#efe7d8', 'dark': '#161617'}[t] }}">{% endif %}
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>Notes</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23fff'/><rect width='64' height='18' fill='%23ffcc00'/><g stroke='%23ccc' stroke-width='2'><line x1='10' y1='30' x2='54' y2='30'/><line x1='10' y1='40' x2='54' y2='40'/><line x1='10' y1='50' x2='54' y2='50'/></g></svg>">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="3.5" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="9.5" y1="4.5" x2="9.5" y2="19.5" stroke="currentColor" stroke-width="1.6"/><line x1="5.5" y1="8.5" x2="7.5" y2="8.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="5.5" y1="11" x2="7.5" y2="11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
  <symbol id="i-compose" viewBox="0 0 24 24"><path d="M11 4.5H7.5a3 3 0 0 0-3 3v9a3 3 0 0 0 3 3h9a3 3 0 0 0 3-3V13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M17.8 3.8a1.6 1.6 0 0 1 2.3 2.3l-7.6 7.6-3.1.8.8-3.1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 6.5h15M9.5 6.5V5a1.5 1.5 0 0 1 1.5-1.5h2A1.5 1.5 0 0 1 14.5 5v1.5M6.5 6.5l.8 12a2 2 0 0 0 2 1.9h5.4a2 2 0 0 0 2-1.9l.8-12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8.3 12.2l2.5 2.5 4.9-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 3.5h6l-1 5.5 3.5 3.5v1.5h-11V12.5L10 9z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 14v6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-pin-fill" viewBox="0 0 24 24"><path d="M9 3.5h6l-1 5.5 3.5 3.5v1.5h-11V12.5L10 9z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 14v6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h3.8l2 2h7.2a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  <symbol id="i-folder-add" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h3.8l2 2h7.2a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 10.5v6M9 13.5h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-all" viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 9h8M8 12.5h8M8 16h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-tag" viewBox="0 0 24 24"><path d="M9 4l-1.6 16M16.6 4L15 20M4.5 9h16M3.5 15h16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15 15l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 4.5L7.5 12 15 19.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.7" fill="currentColor"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/><circle cx="18" cy="12" r="1.7" fill="currentColor"/></symbol>
  <symbol id="i-restore" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3L4.5 9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M4.5 4.5V9H9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="5" cy="6.5" r="1.2" fill="currentColor"/><circle cx="5" cy="12" r="1.2" fill="currentColor"/><circle cx="5" cy="17.5" r="1.2" fill="currentColor"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="4" width="7" height="7" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="4" y="13" width="7" height="7" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="13" width="7" height="7" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
</svg>

<div id="app" class="app" data-pane="list">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <button class="icon-btn" id="btn-sidebar-close" title="Hide sidebar"><svg><use href="#i-sidebar"/></svg></button>
    </div>
    <nav class="sidebar-scroll" id="sidebar-nav" aria-label="Folders"></nav>
    <div class="sidebar-bottom">
      <div class="theme-picker" id="theme-picker" role="radiogroup" aria-label="Theme">
        <button class="theme-opt" data-theme="auto" role="radio" title="Match system"><span class="sw sw-auto"></span>Auto</button>
        <button class="theme-opt" data-theme="light" role="radio" title="Light"><span class="sw sw-light"></span>Light</button>
        <button class="theme-opt" data-theme="warm" role="radio" title="Warm"><span class="sw sw-warm"></span>Warm</button>
        <button class="theme-opt" data-theme="dark" role="radio" title="Dark"><span class="sw sw-dark"></span>Dark</button>
      </div>
      <button class="new-folder-btn" id="btn-new-folder"><svg><use href="#i-folder-add"/></svg><span>New Folder</span></button>
      <div class="account">
        <span class="account-name" title="Signed in">{{ username }}</span>
        <form method="post" action="{{ url_for('logout') }}">
          <input type="hidden" name="csrf" value="{{ csrf_token() }}">
          <button class="link-btn" type="submit">Sign Out</button>
        </form>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- Note list -->
  <section class="list-pane" id="list-pane">
    <header class="toolbar list-toolbar">
      <button class="icon-btn" id="btn-sidebar" title="Show folders"><svg><use href="#i-sidebar"/></svg></button>
      <button class="icon-btn mobile-only back-btn" id="btn-list-back" title="Folders"><svg><use href="#i-back"/></svg><span>Folders</span></button>
      <div class="segmented" role="group" aria-label="View">
        <button class="seg active" id="btn-view-list" title="List view"><svg><use href="#i-list"/></svg></button>
        <button class="seg" id="btn-view-gallery" title="Gallery view"><svg><use href="#i-grid"/></svg></button>
      </div>
      <span class="flex"></span>
      <button class="icon-btn" id="btn-delete" title="Delete note"><svg><use href="#i-trash"/></svg></button>
    </header>
    <div class="list-head">
      <h2 id="list-title">Notes</h2>
      <span id="list-count" class="muted"></span>
    </div>
    <div class="search-wrap">
      <svg><use href="#i-search"/></svg>
      <input id="search" type="search" placeholder="Search" autocomplete="off" aria-label="Search notes">
    </div>
    <div class="trash-banner" id="trash-banner" hidden>
      Notes are deleted permanently after 30 days.
      <button class="link-btn" id="btn-empty-trash">Delete All</button>
    </div>
    <div class="note-list" id="note-list" role="listbox" aria-label="Notes"></div>
    <button class="fab mobile-only" id="btn-new-mobile" title="New note"><svg><use href="#i-compose"/></svg></button>
  </section>

  <!-- Editor -->
  <main class="editor-pane" id="editor-pane">
    <header class="toolbar editor-toolbar">
      <button class="icon-btn mobile-only back-btn" id="btn-editor-back" title="Back"><svg><use href="#i-back"/></svg><span id="back-label">Notes</span></button>
      <button class="icon-btn desktop-only" id="btn-new" title="New note (⌥⌘N)"><svg><use href="#i-compose"/></svg></button>
      <span class="flex"></span>
      <div class="tool-group" id="format-tools">
        <div class="menu-anchor">
          <button class="icon-btn text-btn" id="btn-format" title="Text styles"><span class="aa">Aa</span></button>
          <div class="menu format-menu" id="format-menu" hidden>
            <button data-block="h1" class="fm-title">Title</button>
            <button data-block="h2" class="fm-heading">Heading</button>
            <button data-block="h3" class="fm-sub">Subheading</button>
            <button data-block="div" class="fm-body">Body</button>
            <button data-block="pre" class="fm-mono">Monostyled</button>
            <hr>
            <button data-list="ul">• Bulleted List</button>
            <button data-list="dashed">– Dashed List</button>
            <button data-list="ol">1. Numbered List</button>
            <button data-block="blockquote">▍ Block Quote</button>
            <hr>
            <div class="fm-inline">
              <button data-cmd="bold" title="Bold (⌘B)"><b>B</b></button>
              <button data-cmd="italic" title="Italic (⌘I)"><i>I</i></button>
              <button data-cmd="underline" title="Underline (⌘U)"><u>U</u></button>
              <button data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
            </div>
          </div>
        </div>
        <button class="icon-btn" id="btn-checklist" title="Checklist (⇧⌘L)"><svg><use href="#i-check"/></svg></button>
        <button class="icon-btn" id="btn-pin" title="Pin note"><svg><use href="#i-pin"/></svg></button>
        <div class="menu-anchor">
          <button class="icon-btn" id="btn-more" title="More"><svg><use href="#i-more"/></svg></button>
          <div class="menu more-menu" id="more-menu" hidden>
            <div class="menu-label">Move to</div>
            <div id="move-list"></div>
            <hr>
            <button id="btn-delete-2" class="danger">Delete Note</button>
          </div>
        </div>
      </div>
      <div class="tool-group" id="trash-tools" hidden>
        <button class="pill-btn" id="btn-restore"><svg><use href="#i-restore"/></svg>Recover</button>
      </div>
    </header>
    <div class="editor-scroll" id="editor-scroll">
      <div class="note-date" id="note-date"></div>
      <div class="editor" id="editor" contenteditable="true" spellcheck="true" aria-label="Note body"></div>
      <div class="empty-state" id="empty-state" hidden>No Note Selected</div>
    </div>
    <div class="save-indicator" id="save-indicator" aria-live="polite"></div>
  </main>
</div>

<div class="dialog-backdrop" id="dialog" hidden>
  <form class="dialog" id="dialog-form">
    <h3 id="dialog-title">New Folder</h3>
    <p id="dialog-text" hidden></p>
    <input id="dialog-input" class="auth-input" maxlength="80" autocomplete="off">
    <div class="dialog-actions">
      <button type="button" class="btn-secondary" id="dialog-cancel">Cancel</button>
      <button type="submit" class="btn-primary" id="dialog-ok">OK</button>
    </div>
  </form>
</div>

<div class="ctx-menu menu" id="ctx-menu" hidden></div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
